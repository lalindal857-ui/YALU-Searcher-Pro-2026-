
name: Build YALU Searcher EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --icon=yalu_searcher.ico yalu_searcher.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: YALU-Searcher-EXE
          path: dist/*.exe
